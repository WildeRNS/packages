- type: markdown
  title: ⚙️ Логіка керування СЕС та АКБ
  content: "\U0001F50C **0. DIN-реле мережі (`switch.invertor_220_in`) та Автоматичний контроль**\n\n*Це реле ніколи не вимикається\
    \ автоматикою пакета — тільки вмикається за потреби. Керування цим процесом визначається перемикачем `input_boolean.auto_control_din_relay`\
    \ («Автоматичний контроль DIN-реле»). Коли перемикач УВІМКНЕНО (ON) — діє автоматизація-вартовий, яка через 20 секунд\
    \ автоматично повертає реле в стан ON при випадковому чи аварійному вимкненні, а скрипти забезпечують його увімкнення\
    \ перед використанням мережі. Коли перемикач ВИМКНЕНО (OFF) — авто-відновлення призупиняється, і реле перебуває під виключно\
    \ ручним керуванням користувача.*\n\n\U0001F6E1️ **Захист після рестарту HA:** `binary_sensor.system_ready_for_automation`\
    \ (свіжість SOC + стабільність зв'язку) тепер перевіряється у ВСІХ ключових автоматизаціях пакета (аварійний байпас, вечірнє/ранкове\
    \ перемикання, заряд від мережі, струм СЕС) — жодна з них не діє на застарілих даних одразу після перезапуску HA.\n\n\U0001F39B\
    ️ **Перемикачі керування пакетом:**\n\n| Перемикач | Що робить |\n| :--- | :--- |\n| ⛔ **Пакет: Усі автоматизації** |\
    \ Головний вимикач. OFF = жодна автоматизація пакета не працює, включно з аварійним байпасом SOC<15% і нічним зарядом.\
    \ Сенсори при цьому \"заморожуються\" на останньому значенні й не оновлюються, доки вимикач не увімкнено знову. |\n| ☀️\U0001F319\
    \ **Авто День/Ніч** | Вмикає/вимикає лише «розумну» логіку вечір/ранок (розділ 3 нижче). НЕ впливає на аварійний байпас\
    \ (він завжди пріоритетний) і НЕ впливає на нічний заряд від мережі. |\n| \U0001F50B **Дозвіл зарядки від мережі** | Вмикає/вимикає\
    \ лише автоматичний заряд АКБ від мережі (розділ 4). |\n| \U0001F6A8 **Блекаут/Економія АКБ** | Перемикає ціль резерву\
    \ на окремий слайдер (розділ 5 нижче) і вмикає пріоритет заряджання замість звичайного балансу. Взаємовиключний з «Максимум\
    \ Сонця/АКБ» — вмикання одного вимикає інший. Для повного ефекту вмикайте РАЗОМ з «Авто День/Ніч». |\n| \U0001F506 **Максимум\
    \ Сонця/АКБ** | Вмикає агресивну логіку (розділ 3.1 нижче): перемикання на сонце максимально швидко, ігноруючи звичайний\
    \ розрахований резерв — АКБ може розряджатись нижче нього, але НЕ нижче `input_number.min_target_reserve_kwh` (жорстка\
    \ підстраховка). Взаємовиключний з «Блекаут/Економія» та «Максимум АКБ». Для повного ефекту вмикайте РАЗОМ з «Авто День/Ніч».\
    \ |\n| \U0001F50B **Максимум АКБ** | Суб-режим в опалювальний сезон: контролює пріоритетний заряд АКБ до цільового резерву\
    \ (слайдер «Резерв АКБ (Блекаут / Максимум АКБ)», за замовчуванням 8.0-9.0 кВт·год) до закінчення сонячного дня. За умови\
    \ прогнозу генерації СЕС на сьогодні менше 2.5 кВт·год система залишається на мережі, запобігаючи розряду АКБ домашніми\
    \ приладами та циклічним перемиканням. Перехід на СЕС дозволено виключно при прогнозі СЕС на сьогодні ≥ 2.5 кВт·год (та\
    \ досягненні резерву або потужному профіциті). Увечері зберігає накопичене на мережі. Не використовує заряд від мережі.\
    \ Взаємовиключний з «Максимум Сонця/АКБ» та «Блекаут/Економія». Працює разом з «Авто День/Ніч». |\n| \U0001F9E0 **AI-керування\
    \ день/ніч (Jev)** | Вмикає інтелектуальне фазове AI-керування на базі моделі TypeSafe Jev (розділ 3.2): 5 базових точок\
    \ (07:00, 11:00, 13:00, 17:00, 23:00) + щогодинна оцінка вдень (07:00–19:00) у разі негоди (прогноз < `bad_weather_solar_threshold_kwh`)\
    \ або вранці (08:00–12:00) якщо система на мережі, для повернення на сонце після заряду АКБ. Оптимізує перемикання під\
    \ 3 пікових вікна (07-10, 11-13, 17-19) та сезони тарифу. Керує ВИКЛЮЧНО виходом інвертора і НЕ чіпає заряд від мережі.\
    \ При OFF — діє стандартна детермінована математична логіка. |\n\n\U0001F4CB **Діагностика в реальному часі** (картка\
    \ «Режими та Статуси»): `input_text.output_mode_reason` — причина поточного режиму виходу, оновлюється при кожному перемиканні\
    \ (і автоматичному, і ручному); `input_text.jev_last_decision` — останнє рішення моделі Jev AI з часом, фазою, вибором\
    \ та ключовими аргументами; `sensor.time_in_current_output_mode` — скільки триває поточний режим; `sensor.next_scheduled_mode_check`\
    \ — час наступної запланованої перевірки (07:00/23:00, реактивні тригери можуть спрацювати раніше); `sensor.estimated_solar_mode_remaining`\
    \ — оцінка \"скільки ще протримається сонце\" при поточному навантаженні (застосовна лише в опалювальний сезон чи Блекаут\
    \ — там, де діє страховка по резерву).\n\n\U0001F579️ **Ручне перемикання** (картка «Ручне перемикання» на дашборді) —\
    \ кнопки безпосередньо запускають `script.switch_to_solar_bypass` і `script.switch_to_grid_bypass` — ті самі скрипти,\
    \ якими користуються всі автоматизації пакета (перевірка реле, зміна пріоритету, звірка й сповіщення). Якщо «Авто День/Ніч»\
    \ залишається увімкненим, наступна подія (зміна SOC, 07:00/23:00) може знову переоцінити й переключити автоматично — ручна\
    \ кнопка не \"заморожує\" вибір назавжди, лише діє негайно, зараз.\n\n⚡ **Ємність АКБ (кВт·год)** рахується як `Ah (з\
    \ BMS) × 51.2В (номінальна напруга)` — фіксована константа, а не \"жива\" напруга під навантаженням, тож число стабільне.\
    \ Якщо `sensor.bms_battery_full_capacity` тимчасово недоступний (BMS відключився, рестарт HA) — сенсор тримає останнє\
    \ відоме значення. Обидва слайдери резерву (звичайний і блекаут-режиму) автоматично обмежуються цією ємністю (макс. фізично\
    \ 10 кВт·год): якщо виставити забагато, значення саме повернеться назад із поясненням у сповіщенні.\n\n---\n\n☀️ **1.\
    \ Динамічне налаштування струму заряду СЕС**\n\n*У звичайному режимі працює тільки коли вихід у пріоритеті `PV-Battery-Utility`\
    \ (живимось від сонця). Струм автоматично адаптується під залишок прогнозу генерації та потребу АКБ у дозаряді — прогноз\
    \ генерації множиться на «Калібрування прогнозу генерації» (картка лімітів, за замовчуванням ×1.0, підлаштуйте за власними\
    \ спостереженнями — той самий коефіцієнт впливає і на рішення про перемикання день/ніч). Усі пороги SOC і рівні струму\
    \ винесені в слайдери картки «\U0001F39A️ Пороги гістерезису заряду СЕС» — значення в таблиці відповідають заводським\
    \ налаштуванням за замовчуванням.*\n\n| Умова генерації | Рівень SOC | Струм заряду |\n| :--- | :--- | :--- |\n| **Достатньо\
    \ сонця** *(прогноз ≥ нестача + 1.5 кВт·год)* | 0–70% | **40 A** |\n| | 71–85% | **20 A** |\n| | 86–100% | **10 A** |\n\
    | **Недостатньо сонця** | 0–85% | **40 A** (прискорений заряд) |\n| | 86–100% | **10 A** |\n| **Поза вікном 06:00–21:00\
    \ (ніч)** | Будь-який | **30 A** (окремий незалежний параметр) |\n| \U0001F6A8 **Режим Блекаут/Економія (будь-коли)**\
    \ | 0–95% | **40 A** (максимум, незалежно від вікна дня/ночі) |\n| | 95–100% | **10 A** (тейперинг про безпеку АКБ) |\n\
    \n*Невеликий буфер гістерезису (±3%) навколо кожної межі — струм не \"смикається\" туди-сюди при коливаннях SOC точно\
    \ на межі. ⚠️ Це вікно 06:00–21:00 — розклад саме для струму СЕС, і воно НЕ те саме, що нічний тариф мережі (23:00–07:00)\
