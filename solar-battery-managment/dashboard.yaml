    \ струм СЕС максимізується незалежно від того, чи будинок живиться від сонця чи від мережі (`charge_source_priority` і\
    \ `output_source_priority` — незалежні настройки інвертора).*\n\n---\n\n### \U0001F6E1️ 2. Аварійний захист від глибокого\
    \ розряду (найвищий пріоритет)\n\n*Працює завжди, незалежно від «Авто День/Ніч» — це жорсткий запобіжник. Перевірка виконується\
    \ кожні 5 хвилин або миттєво при перетині порогів SOC.*\n\n* **\U0001F4C9 SOC < 15%:** переключення пріоритету виходу\
    \ на `PV-Utility-Battery` (мережа). Напруга мережі більше НЕ перевіряється — інвертор сам коректно живиться з доступного\
    \ джерела незалежно від встановленого пріоритету.\n* **\U0001F4C8 SOC ≥ 25%:** повернення пріоритету виходу на `PV-Battery-Utility`\
    \ — але тільки якщо «Авто День/Ніч» **вимкнено** (інакше цим керує розділ 3 нижче, щоб уникнути подвійного керування).\n\
    \n---\n\n### ☀️\U0001F319 3. «Авто День/Ніч» — розумне вечірнє/ранкове перемикання\n\n*Активно лише коли перемикач «Авто\
    \ День/Ніч» = **ON**. Ніколи не суперечить аварійному байпасу (розділ 2) чи заряду від мережі (розділ 4). Прогноз генерації\
    \ скрізь нижче множиться на «Калібрування прогнозу генерації» (за замовчуванням ×1.0).*\n\n* **\U0001F319 Ввечері о 23:00**\
    \ — якщо прогноз генерації на завтра значно менший за прогнозоване споживання (запас +20% на похибку прогнозу споживання,\
    \ з урахуванням поточного заряду АКБ понад резерв) — переключення на `PV-Utility-Battery` (мережа).\n* **☀️ Зранку о 7:00**\
    \ (і будь-коли протягом дня, щойно АКБ дозарядиться) — конкретна умова залежить від активного режиму (розділ 3.1 нижче),\
    \ але завжди з тим самим захистом: поріг \"готовності\" ніколи не буває нижчим за поріг повернення на мережу (пункт \"\
    Протягом дня\" нижче) +2% — інакше дві автоматизації \"тягли в різні боки\" щохвилини (саме так виник цикл переключень,\
    \ коли розрахований резерв виявився вищим за колишню жорстку межу 32%).\n* **\U0001F504 Протягом дня** — динамічне повернення\
    \ на мережу, якщо АКБ (у режимі сонця) впаде до відповідного порогу — залежно від активного режиму (розділ 3.1 нижче).\n\
    \n#### 3.1. Три режими \"готовності до сонця\" (яка умова діє зранку/вдень)\n\n| Режим | Умова переходу на сонце (7:00+)\
    \ | Поріг повернення на мережу |\n| :--- | :--- | :--- |\n| **Звичайний** (обидва перемикачі нижче — OFF) | АКБ > цільового\
    \ резерву **АБО** > 30% заряду, **І** прогнозу на залишок сьогодні вистачає (**АБО** запас в АКБ > 1 кВт·год понад резерв)\
    \ | Цільовий розрахований резерв (`sensor.calculated_target_reserve_kwh`) — 30% АКБ (~2.87 кВт·год) взимку / 20% АКБ (~1.91\
    \ кВт·год) влітку |\n| \U0001F506 **Максимум Сонця/АКБ** | АКБ > `input_number.min_target_reserve_kwh` (простий мінімум-підстраховка,\
    \ а не повний сезонний резерв) — прогноз і \"чи вистачає сонця\" ІГНОРУЮТЬСЯ повністю | `input_number.min_target_reserve_kwh`\
    \ (та сама підстраховка — АКБ ніколи не розряджається нижче неї, навіть у цьому режимі) |\n| \U0001F6A8 **Блекаут/Економія\
    \ АКБ** | АКБ > `input_number.blackout_reserve_kwh` **АБО** сонця сьогодні вистачає з запасом (`today_solar_shortfall_kwh\
    \ == 0`) | `input_number.blackout_reserve_kwh` (значно вищий за звичайний) |\n\n*«Максимум Сонця/АКБ», «Блекаут/Економія»\
    \ та «Максимум АКБ» — взаємовиключні (розділ 0 вище). Обидва режими використовують ту саму \"анти-гойдалка\" логіку (+2%\
    \ запасу між порогом переходу на сонце і порогом повернення на мережу), тож дублювання циклу переключень, як показано\
    \ вище, у жодному з них не станеться.*\n\n#### 3.2. \U0001F9E0 Фазове AI-керування Jev (5 точок + щогодини в негоду)\n\
    \n*Активується тумблером «\U0001F9E0 AI-керування день/ніч (Jev)». Модель HA-Jev (TypeSafe AI) керує ВИКЛЮЧНО виходом\
    \ інвертора (`PV-Battery-Utility` чи `PV-Utility-Battery`) і НЕ має права вмикати заряд від мережі. Система повністю очищена\
    \ від ненадійних штучних прогнозів споживання — аналіз базується на реальному залишку АКБ над мінімальним резервом, прогнозі\
    \ генерації Volcast та 3-х пікових вікнах побутового споживання.*\n\n* **⏰ Стратегічні точки та розклад аналізу:**\n \
    \ 1. **07:00 (Ранок):** Старт пікового вікна 07:00–10:00. Модель оцінює буфер АКБ, щоб замістити дорогий денний тариф\
    \ міської мережі; денне сонце поверне витрачене в обід.\n  2. **11:00 (Обід):** Старт пікового вікна 11:00–13:00. Суміщення\
    \ піку навантаження з піком сонячної інсоляції.\n  3. **13:00 (Після обіду):** Завершення обіднього піку. В опалювальний\
    \ сезон при слабкому сонці безпечно стати на мережу для збереження АКБ на вечір; в неопалювальний — тримати сонце.\n \
    \ 4. **17:00 (Вечір):** Старт пікового вікна 17:00–19:00. Проходження вечірнього піку на накопиченому заряді АКБ.\n  5.\
    \ **23:00 (Ніч):** Оцінка збереження заряду АКБ на завтрашній ранок vs робота від батареї вночі.\n  6. **☁️ Щогодинний\
    \ запуск у негоду (08:00–19:00):** Якщо денний прогноз СЕС нижчий за слайдер `input_number.bad_weather_solar_threshold_kwh`\
    \ (наприклад, < 5.0 кВт·год), модель викликається щогодини на початку кожної години, гнучко адаптуючись до похмурої погоди.\
    \ Після 19:00 перевірки припиняються, наступна — штатна нічна о 23:00.\\n  7. **\U0001F305 Ранкове повернення на Сонце\
    \ (08:00–12:00):** Якщо інвертор на міській мережі (`output_on_grid` = on), модель викликається щогодини вранці. Щойно\
    \ ранкове сонце підзарядить АКБ вище резерву, система автоматично перейде на сонце, не очікуючи 11:00.\n\n* **❄️ Опалювальний\
    \ vs ☀️ Неопалювальний сезон:**\n  * *Неопалювальний сезон:* День удвічі дорожчий за ніч — модель надає максимальний пріоритет\
    \ «Сонцю», доки заряд вище мінімального захисного резерву.\n  * *Опалювальний сезон:* Тариф цілодобово однаковий — пріоритет\
    \ на 3 пікові вікна (07–10, 11–13, 17–19). Поза ними при хмарності безпечно обирати мережу, щоб зберегти АКБ.\n\n* **\U0001F6E1\
    ️ Безпека та узгодженість порогів:**\n  * При активному Jev AI денна автоматика повернення на мережу (`solar_auto_daytime_fallback`)\
    \ використовує захисний поріг `input_number.min_target_reserve_kwh` (зараз 2.5 кВт·год / 26%), тому система не скидається\
    \ передчасно на мережу в пікові години, доки в батареї є корисний заряд.\n  * Ранковий поріг готовності до Сонця в Jev\
    \ AI тепер також динамічно вираховується від слайдера `min_target_reserve_kwh` з гістерезисом +4% (зараз 30%). Якщо користувач\
    \ пересуває слайдер резерву, поріг готовності Jev AI автоматично змінюється синхронно.\n  * Денний захисний фільтр Jev\
    \ AI: утримує інвертор на Сонці виключно тоді, коли система вже працює на Сонці, і генерація СЕС покриває навантаження\
    \ або заряд АКБ вище мінімального резерву слайдера. Він ніколи не перемикає систему з Мережі на Сонце всупереч рішенню\
    \ моделі.\\n            * Якщо API Jev не відповідає (таймаут, відсутність зв'язку) — система не зависає: надсилається\
    \ сповіщення, і автоматика застосовує захисний фолбек (о 07:00 при АКБ ≥ 32% переходить на сонце за замовчуванням).\n\
    \  * Апаратні захисти (байпас SOC < 15%) діють безперервно в реальному часі.\n\n\n---\n\n### \U0001F50C 4. Нічний/денний\
    \ заряд АКБ від мережі\n\n* **\U0001F319 Нічний тариф:** 23:00 – 07:00 (⚠️ інше вікно, ніж розклад СЕС у розділі 1 — див.\
    \ примітку там).\n* **❄️ Опалювальний сезон (Жовтень – Квітень):** Цільовий резерв АКБ = **30% від повної ємності АКБ**\
    \ (~2.87 кВт·год при ємності 9.56 кВт·год).\n* **☀️ Літній сезон (Травень – Вересень):** Цільовий резерв АКБ = **20% від\
    \ повної ємності АКБ** (~1.91 кВт·год).\n* **\U0001F39A️ Нижня планка (підстраховка):** Слайдер `input_number.min_target_reserve_kwh`\
    \ є гарантованою нижньою межею: якщо ви виставили значення вище за розраховане, система автоматично орієнтується на ваш\
    \ слайдер.\n* **Умови запуску зарядки (з 23:00):**\n  * Перемикач *\"Дозвіл заряджання від мережі\"* у стані **ON**.\n\
    \  * Поточний залишок у кВт·год менший за розрахований цільовий резерв мінус 0.5 кВт·год.\n  * І одне з: (а) вночі очікується\
    \ дефіцит завтра (перевищує «Поріг суттєвого дефіциту»); (б) опалювальний сезон і активний поточний дефіцит; (в) критичний\
    \ SOC < 15%; (г) \U0001F6A8 **режим Блекаут/Економія і активний поточний дефіцит — БУДЬ-ЯКОЇ пори доби й сезону** (пріоритет\
    \ заряджання).\n* Заряд безумовно зупиняється о **07:00**, а також миттєво при досягненні цільового резерву. * Напруга\
    \ мережі більше НЕ перевіряється перед стартом заряду — тим самим принципом, що й для байпасу: інвертор сам впорається.\
    \ * «Поріг суттєвого дефіциту» (картка лімітів, за замовчуванням 0.3 кВт·год) — спільна «мертва зона» проти шуму округлення\
    \ прогнозів: без неї дрібні (0.01–0.1 кВт·год) коливання прогнозу постійно смикали б відповідні прапорці дефіциту. Один\
    \ слайдер керує одразу трьома індикаторами дефіциту на дашборді.\n\n---\n\n### \U0001F6A8 5. Режими «Блекаут/Економія\
    \ АКБ», \U0001F50B «Максимум АКБ» та \U0001F506 «Максимум Сонця/АКБ»\n\n*Усі три — суто ручні перемикачі, не вмикаються/вимикаються\
    \ автоматично за сезоном чи погодою, і взаємовиключні між собою (розділ 0 вище). Для повного ефекту вмикайте кожен РАЗОМ\
    \ з «Авто День/Ніч» (інакше перемикання виходу день/ніч просто не працюватиме, хоча заряд від мережі й струм СЕС працюватимуть\
    \ незалежно).*\n\n**\U0001F6A8 Блекаут/Економія АКБ** — призначений для холодного періоду з малою генерацією й ризиком\
    \ відключень мережі: * Цільовий резерв повністю замінюється окремим слайдером («Резерв АКБ (Блекаут / Максимум АКБ)»)\
    \ замість звичайного сезонного розрахунку — без верхньої межі 85% ємності (це ваше явне число, обмежене лише реальною\
    \ фізичною ємністю АКБ). * Пріоритетний заряд від мережі будь-якої пори доби (розділ 4 вище), максимальний струм заряду\
    \ СЕС незалежно від режиму виходу (розділ 1 вище), і суворіша умова переходу на сонце вранці (розділ 3.1 вище).\n**\U0001F50B\
    \ Максимум АКБ** — призначений для опалювального сезону (однаковий цілодобовий тариф) для пріоритетного накопичення сонячної\
    \ енергії в АКБ на випадок відключень: * Цільовий резерв задається слайдером `input_number.blackout_reserve_kwh` («Резерв\
    \ АКБ (Блекаут / Максимум АКБ)», наприклад 9.0 кВт·год) замість загального мінімуму `min_target_reserve_kwh`. * Поріг\
    \ прогнозу СЕС 2.5 кВт·год: за умови прогнозу генерації СЕС на сьогодні < 2.5 кВт·год система безумовно залишається на\
    \ мережі, спрямовуючи всю доступну енергію сонця на заряд або підтримку АКБ та уникаючи циклічного смикання інвертора.\
    \ * Перехід на СЕС дозволено виключно при прогнозі СЕС на сьогодні ≥ 2.5 кВт·год за наявності профіциту (баланс ≥ +1.5\
    \ кВт·год) або досягненні заданого резерву при активному сонці. * Динамічний траєкторний баланс (`sensor.max_battery_trajectory_balance`):\
    \ зіставляє залишок сонячного прогнозу до кінця дня зі споживанням дому та дефіцитом енергії до заданого резерву. * Увечері\
    \ (генерація СЕС < 150 Вт або після 17:00 / захід сонця) або при слабкому прогнозі на день (< 2.5 кВт·год) будинок надійно\
    \ залишається або перемикається на мережу для збереження накопиченої в АКБ енергії. * Не використовує платний заряд від\
    \ мережі (тільки безкоштовне сонце).\n\n**\U0001F506 Максимум Сонця/АКБ** — призначений для сонячного періоду, коли денний\
    \ тариф мережі дорожчий за нічний: * Перемикання на сонце максимально швидко (7:00+), ігноруючи звичайний цільовий резерв\
    \ — АКБ може розряджатись значно нижче нього, але НЕ нижче `input_number.min_target_reserve_kwh` (розділ 3.1 вище) — це\
    \ ваша явна вимога, реалізована через повернення `solar_auto_daytime_fallback` до роботи в цьому режимі, просто з іншим\
    \ (набагато нижчим) порогом.\n**Спільне для режимів:** * Оскільки практично вся логіка пакета (дефіцити, заряд від мережі,\
    \ ранкове/денне перемикання) спирається саме на цільовий резерв — зміна режиму автоматично впливає на систему в більшості\
    \ аспектів без додаткового коду. * `input_boolean.allow_grid_charge` і аварійні пороги 15%/25% **не залежать** від жодного\
    \ з цих режимів — перше залишається окремим дозволом, друге — універсальна межа безпеки АКБ. * Увімкнення/вимкнення кожного\
    \ супроводжується окремим сповіщенням з поточним активним цільовим резервом.\n\n---\n\n### \U0001F514 6. Контроль та підтвердження\
    \ дій\n\n* **Захист від дублювання:** перед відправкою команд кожен скрипт перевіряє поточний стан інвертора. Якщо він\
    \ вже в потрібній позиції, виконання зупиняється без повторних команд і сповіщень.\n* Кожна зміна параметрів перевіряється\
    \ після виконання команди інвертору — включно зі стартом/зупинкою заряду від мережі та зміною струму заряду СЕС.\n* При\
    \ успішному виконанні надсилається зелене сповіщення **`✅`** (або тематичне \U0001F506/\U0001F50C).\n* У разі збою зв'язку\
    \ чи невиконання команди — аварійне сповіщення **`⚠️`**.\n* **\U0001F3F7️ Стандартизоване маркування джерела рішень:**\n\
    \  * `\U0001F9E0 [Jev AI]` — рішення нейромережі з деталізацією (вибір, фаза, прогноз, АКБ);\n  * `⚙️ [Локальна автоматика]`\
    \ — спрацювання детермінованих правил пакета;\n  * `\U0001F6A8 [Аварійний захист]` — апаратний захист батареї (SOC < 15%\
    \ / ≥ 25%);\n  * `\U0001F464 [Вручну]` — дії користувача на дашборді.\n  Усі системні сповіщення про зміну пріоритету\
    \ виходу інвертора додатково містять рядок:\n  `Ініціатор / Причина: <хто і чому прийняв рішення>`.\n"
